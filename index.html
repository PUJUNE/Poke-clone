<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>포켓몬 클론 — 1세대 151마리 · 관동지방</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game" width="768" height="576"></canvas>
  <div id="help">이동: 방향키/WASD &nbsp;|&nbsp; 확인: Z/Enter &nbsp;|&nbsp; 취소: X/Esc &nbsp;|&nbsp; 메뉴: Enter</div>
  <div id="savebar">
    <button id="btnExport" type="button">세이브 내보내기 (JSON)</button>
    <button id="btnImport" type="button">세이브 불러오기 (JSON)</button>
    <span id="saveStatus"></span>
    <input id="fileImport" type="file" accept="application/json,.json" hidden>
  </div>
</div>
<div id="vpad">
  <div id="dpad">
    <button class="vbtn" id="vLeft" type="button">↖</button>
    <button class="vbtn" id="vUp" type="button">↗</button>
    <button class="vbtn" id="vDown" type="button">↙</button>
    <button class="vbtn" id="vRight" type="button">↘</button>
  </div>
  <button class="vbtn vmenu" id="vMenu" type="button">MENU</button>
  <div id="abpad">
    <button class="vbtn vab" id="vB" type="button">B</button>
    <button class="vbtn vab" id="vA" type="button">A</button>
  </div>
</div>
<script src="pokedex.js"></script>
<script src="map.js"></script>
<script src="game.js"></script>
</body>
</html>
