<!DOCTYPE html>
<html lang="ko">
<head>

<title>포켓몬 클론 — 1세대 151마리 · 관동지방</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">

<script src="map.js"></script>
